  <script>
    // ===== BANK SOAL BAHASA INDONESIA PAKET B =====
    const BANK = {
      mudah: [
        { q: 'Teks yang berisi hasil pengamatan terhadap suatu objek disebut...', opsi: ['Teks laporan observasi', 'Cerpen', 'Puisi', 'Surat pribadi'], j: 0, b: 'Teks laporan observasi berisi fakta hasil pengamatan secara objektif.' },
        { q: 'Kalimat pembuka surat resmi yang tepat adalah...', opsi: ['Dengan hormat,', 'Hai, apa kabar?', 'Wassalam', 'Oke, langsung saja'], j: 0, b: 'Surat resmi menggunakan bahasa baku, diawali salam "Dengan hormat".' },
        { q: 'Bagian puisi yang menjadi pokok pikiran disebut...', opsi: ['Tema', 'Rima', 'Diksi', 'Tipografi'], j: 0, b: 'Tema adalah dasar/pokok pikiran yang menjiwai seluruh puisi.' },
        { q: 'Iklan bertujuan untuk...', opsi: ['Mengajak pembeli memanfaatkan barang/jasa', 'Menceritakan kisah panjang', 'Menyimpan data', 'Membuat surat izin'], j: 0, b: 'Iklan bersifat persuasif: mengajak orang membeli/memakai sesuatu.' },
        { q: 'Tokoh yang bersifat jahat dalam naskah drama disebut...', opsi: ['Antagonis', 'Protagonis', 'Penulis', 'Sutradara'], j: 0, b: 'Antagonis adalah lawan (tokoh jahat), protagonis tokoh baik.' },
        { q: 'Ciri bahasa surat resmi adalah...', opsi: ['Baku dan formal', 'Gaul dan santai', 'Banyak singkatan tidak resmi', 'Menggunakan kata ganti diri pertama'], j: 0, b: 'Surat resmi memakai bahasa baku, formal, dan kalimat efektif.' },
        { q: 'Kalimat pendek dan mudah diingat untuk ajakan disebut...', opsi: ['Slogan', 'Cerpen', 'Pantun', 'Novel'], j: 0, b: 'Slogan adalah ungkapan pendek yang mudah diingat dan menarik.' },
        { q: 'Unsur fisik puisi berupa gambaran benda melalui pancaindra disebut...', opsi: ['Imaji/ima', 'Tema', 'Amanat', 'Nuansa'], j: 0, b: 'Imaji adalah gambaran yang menghadirkan pengalaman indra.' },
        { q: 'Cerita rekaan pendek dengan satu peristiwa penting disebut...', opsi: ['Cerpen', 'Drama', 'Pantun', 'Laporan'], j: 0, b: 'Cerpen = cerita pendek, satu kesatuan efek, sedikit tokoh.' },
        { q: 'Bagian surat berisi nama dan alamat lembaga disebut...', opsi: ['Kop surat', 'Salam penutup', 'Lampiran', 'Hal'], j: 0, b: 'Kop surat memuat nama, alamat, dan identitas lembaga.' }
      ],
      sedang: [
        { q: 'Struktur teks laporan observasi yang benar adalah...', opsi: ['Pernyataan umum - deskripsi bagian - deskripsi manfaat', 'Abstrak - konflik - penyelesaian', 'Orientasi - komplikasi - resolusi', 'Bahan - alasan - simpulan'], j: 0, b: 'Struktur teks laporan observasi: pernyataan umum, deskripsi bagian, deskripsi manfaat.' },
        { q: 'Rima dalam puisi adalah...', opsi: ['Pengulangan bunyi yang teratur', 'Pemilihan kata keras', 'Jumlah baris dalam satu bait', 'Pesan moral penyair'], j: 0, b: 'Rima adalah persamaan/pengulangan bunyi dalam puisi.' },
        { q: 'Urutan alur cerpen yang benar adalah...', opsi: ['Perkenalan - konflik - klimat - penyelesaian', 'Klimat - perkenalan - konflik', 'Penyelesaian - konflik - perkenalan', 'Konflik - penyelesaian - perkenalan'], j: 0, b: 'Alur umum: perkenalan, konflik, klimat, lalu penyelesaian.' },
        { q: 'Kata "hal" pada surat resmi digunakan untuk...', opsi: ['Menyebut pokok pembahasan surat', 'Menyebut tanggal surat', 'Menyebut alamat lembaga', 'Menyebut nama penerima'], j: 0, b: 'Bagian "Hal" menyebutkan pokok masalah yang dibicarakan dalam surat.' },
        { q: 'Ciri iklan berikut yang TIDAK benar adalah...', opsi: ['Berisi urutan langkah kerja', 'Berbahasa persuasif', 'Singkat dan menarik', 'Dilengkapi kata kunci'], j: 0, b: 'Urutan langkah kerja ciri teks prosedur, bukan iklan.' },
        { q: 'Prolog dalam naskah drama berfungsi sebagai...', opsi: ['Pembukaan cerita', 'Penutup cerita', 'Komentar tokoh', 'Daftar pemain'], j: 0, b: 'Prolog membuka cerita; epilog menutup cerita.' },
        { q: 'Diksi adalah...', opsi: ['Pemilihan kata yang tepat', 'Pengulangan bunyi akhir', 'Susunan bait', 'Ungkapan perasaan penyair'], j: 0, b: 'Diksi = pilihan kata. Salah diksi membuat makna berubah.' },
        { q: 'Deskripsi manfaat pada teks laporan observasi berisi...', opsi: ['Guna atau kegunaan objek yang diamati', 'Nama ilmiah objek', 'Waktu pengamatan', 'Daftar pustaka'], j: 0, b: 'Deskripsi manfaat menjelaskan kegunaan/manfaat objek.' },
        { q: 'Amanat cerpen biasanya ditemukan melalui...', opsi: ['Konflik dan penyelesaian cerita', 'Daftar kata', 'Kop surat', 'Jumlah baris'], j: 0, b: 'Amanat tersirat melalui konflik, tokoh, dan penyelesaian cerita.' },
        { q: 'Poster berbeda dengan iklan karena poster...', opsi: ['Menggabungkan gambar dan teks untuk informasi/ajakan', 'Harus berisi harga barang', 'Selalu berisi cerita panjang', 'Tidak boleh memakai gambar'], j: 0, b: 'Poster menggabungkan unsur grafis (gambar + teks) untuk informasi/ajakan.' }
      ],
      sulit: [
        { q: 'Perbedaan utama pantun dan syair adalah...', opsi: ['Pantun bersajak a-b-a-b dan ada pesan, syair cenderung bercerita tanpa pantun pembuka', 'Pantun tidak memiliki rima', 'Syair selalu empat baris', 'Keduanya sama saja'], j: 0, b: 'Pantun bersajak a-b-a-b dengan sampiran-isi; syair bercerita tanpa pantun pembuka.' },
        { q: 'Teknik penokohan yang muncul langsung dari dialog dan perbuatan tokoh disebut teknik...', opsi: ['Dramatik', 'Analitik', 'Campuran', 'Naratif'], j: 0, b: 'Teknik dramatik menampilkan karakter lewat dialog, perbuatan, komentar tokoh lain.' },
        { q: 'Kalimat berikut yang efektif adalah...', opsi: ['Para siswa-siswa belajar di kelas', 'Bagi siswa-siswa supaya belajar', 'Sekalian siswa-siswa belajar di kelas', 'Para siswa-siswa semua belajar'], j: 0, b: 'Kalimat efektif tidak memakai "para" di depan kata bersuku "siswa-siswa" (pemenggandaan ganda).' },
        { q: 'Sudut pandang orang pertama pelaku utama ditandai kata ganti...', opsi: ['Saya/aku', 'Dia/ia', 'Kalian', 'Beliau'], j: 0, b: 'Orang pertama pelaku utama memakai "saya/aku".' },
        { q: 'Majas yang membandingkan dua hal secara langsung dengan kata "bagai" adalah...', opsi: ['Metafora dibedakan dari simile', 'Hiperbola', 'Personifikasi', 'Metonimia'], j: 0, b: 'Simile/majas perbandingan memakai kata pembanding seperti "bagai/laksana".' },
        { q: 'Bagian surat "Lampiran: 1 (satu) berkas" berfungsi untuk...', opsi: ['Menyebut jumlah dokumen yang menyertai surat', 'Menyebut tanggal surat', 'Menyebut penerima surat', 'Menutup surat'], j: 0, b: 'Lampiran menyatakan dokumen tambahan yang menyertai surat.' },
        { q: 'Nuansa puisi yang menyedihkan biasanya dibangun lewat...', opsi: ['Pilihan diksi dan imaji gelap', 'Jumlah bait yang banyak', 'Judul yang panjang', 'Nama penyair'], j: 0, b: 'Suasana dibangun lewat diksi, imaji, dan citraan yang dipilih penyair.' },
        { q: 'Kramagung dalam naskah drama berfungsi untuk...', opsi: ['Menjelaskan latar, suasana, dan gerak tokoh', 'Menjadi tokoh utama', 'Mengganti dialog', 'Menutup pementasan'], j: 0, b: 'Kramagung/lakuan menjelaskan latar, suasana, petunjuk gerak.' },
        { q: 'Bahasa iklan berikut yang paling persuasif adalah...', opsi: ['Ayo, jaga kesehatanmu dengan vitamin ini!', 'Vitamin itu bagus.', 'Vitamin dijual di sini.', 'Vitamin berisi vitamin C.'], j: 0, b: 'Kata "ayo" bersifat mengajak (persuasif) dan memancing pembeli.' },
        { q: 'Data pada teks laporan observasi harus diperoleh melalui...', opsi: ['Pengamatan langsung atau riset', 'Menebak-nebak', 'Imajinasi penulis', 'Cerita orang lain saja'], j: 0, b: 'Laporan observasi bersumber dari pengamatan/riset yang nyata.' }
      ]
    };

    const LEVEL_INFO = {
      mudah: { nama: 'Mudah', ikon: 'sentiment_satisfied', warna: 'text-primary', bg: 'bg-surface-container-lowest', sub: '10 soal dasar • 10 poin/soal' },
      sedang: { nama: 'Sedang', ikon: 'sentiment_neutral', warna: 'text-tertiary', bg: 'bg-surface-container-lowest', sub: '10 soal menengah • 10 poin/soal' },
      sulit: { nama: 'Sulit', ikon: 'whatshot', warna: 'text-error', bg: 'bg-surface-container-lowest', sub: '10 soal menantang • 10 poin/soal' }
    };

    // ===== STATE =====
    let soalAktif = [];
    let indexSoal = 0;
    let jawabanBenar = 0;
    let levelAktif = '';
    let sudahMengunci = false;

    // ===== RENDER PILIH LEVEL =====
    function renderLevel() {
      const list = document.getElementById('levelList');
      let html = '';
      Object.keys(LEVEL_INFO).forEach(k => {
        const l = LEVEL_INFO[k];
        const best = getBestScore(k);
        html += `
      <button class="flex items-center gap-3 ${l.bg} rounded-xl p-space-md shadow-md active:translate-y-0.5 transition-transform text-left" onclick="mulaiKuis('${k}')">
        <div class="w-12 h-12 rounded-xl bg-surface-container flex items-center justify-center flex-shrink-0">
          <span class="material-symbols-outlined text-[26px] ${l.warna}" style="font-variation-settings: 'FILL' 1;">${l.ikon}</span>
        </div>
        <div class="flex flex-col min-w-0 flex-1">
          <span class="font-title-md text-title-md text-on-surface">Kuis ${l.nama}</span>
          <span class="font-body-sm text-body-sm text-on-surface-variant">${l.sub}</span>
        </div>
        <div class="flex flex-col items-end gap-0.5 flex-shrink-0">
          <span class="font-label-sm text-label-sm text-outline">Terbaik</span>
          <span class="font-label-md text-label-md text-primary font-bold">${best}</span>
        </div>
      </button>`;
      });
      list.innerHTML = html;
    }

    // ===== MULAI KUIS =====
    function mulaiKuis(level) {
      levelAktif = level;
      soalAktif = acakSoal(BANK[level]);
      indexSoal = 0;
      jawabanBenar = 0;

      document.getElementById('screenPilih').classList.add('hidden');
      document.getElementById('screenHasil').classList.add('hidden');
      document.getElementById('screenKuis').classList.remove('hidden');
      document.getElementById('screenKuis').classList.add('flex');
      document.getElementById('kuisLevel').textContent = 'Tingkat: ' + LEVEL_INFO[level].nama;
      tampilkanSoal();
    }

    function acakSoal(arr) {
      // Acak urutan soal agar setiap percobaan berbeda
      const copy = arr.slice();
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      // Acak juga urutan opsi per soal
      return copy.map(s => {
        const opsi = s.opsi.map((t, i) => ({ t, benar: i === s.j }));
        for (let i = opsi.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [opsi[i], opsi[j]] = [opsi[j], opsi[i]];
        }
        return { q: s.q, opsi, b: s.b, jBenar: opsi.findIndex(o => o.benar) };
      });
    }

    function tampilkanSoal() {
      sudahMengunci = false;
      const s = soalAktif[indexSoal];
      const total = soalAktif.length;

      document.getElementById('kuisProgres').textContent = (indexSoal + 1) + '/' + total;
      document.getElementById('kuisBar').style.width = Math.round((indexSoal / total) * 100) + '%';
      document.getElementById('kuisPertanyaan').textContent = s.q;

      // Sembunyikan pembahasan sebelumnya
      document.getElementById('pembahasanBox').classList.add('hidden');
      document.getElementById('btnLanjut').classList.add('hidden');

      const opsiBox = document.getElementById('kuisOpsi');
      opsiBox.innerHTML = '';
      const huruf = ['A', 'B', 'C', 'D'];
      s.opsi.forEach((o, i) => {
        const btn = document.createElement('button');
        btn.className = 'w-full flex items-center gap-3 p-3.5 rounded-xl bg-surface-container text-on-surface font-body-md text-body-md text-left active:translate-y-[2px] transition-all shadow-[0_3px_0_#c0c7d4]';
        btn.innerHTML = `
        <span class="w-7 h-7 rounded-full bg-surface-container-high flex items-center justify-center font-label-md text-label-md text-primary flex-shrink-0">${huruf[i]}</span>
        <span class="flex-1">${o.t}</span>`;
        btn.addEventListener('click', () => pilihJawaban(i));
        opsiBox.appendChild(btn);
      });
    }

    // ===== SOUND EFFECT (Web Audio API, tanpa file eksternal) =====
  let audioCtx = null;
  function getAudioCtx() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  function playTone(freq, dur, type, when, gainVal) {
    const ctx = getAudioCtx();
    if (!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(gainVal || 0.15, ctx.currentTime + when);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + when + dur);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(ctx.currentTime + when);
    osc.stop(ctx.currentTime + when + dur);
  }
  function playSoundCorrect() {
    // Nada naik ceria: do - mi - so
    playTone(523.25, 0.12, 'sine', 0);
    playTone(659.25, 0.12, 'sine', 0.10);
    playTone(783.99, 0.22, 'sine', 0.20);
  }
  function playSoundWrong() {
    // Nada turun rendah: buzz salah
    playTone(220, 0.20, 'square', 0, 0.08);
    playTone(160, 0.30, 'square', 0.15, 0.08);
  }
  function playSoundFinish() {
    // Fanfare kuis selesai
    playTone(523.25, 0.15, 'sine', 0);
    playTone(659.25, 0.15, 'sine', 0.15);
    playTone(783.99, 0.15, 'sine', 0.30);
    playTone(1046.50, 0.40, 'sine', 0.45);
  }

  // ===== MENJAWAB =====
    function pilihJawaban(idx) {
      if (sudahMengunci) return;
      sudahMengunci = true;

      const s = soalAktif[indexSoal];
      const benar = idx === s.jBenar;
      if (benar) jawabanBenar++;

      // Sound effect benar / salah
      if (benar) {
        playSoundCorrect();
      } else {
        playSoundWrong();
      }

      const opsiBox = document.getElementById('kuisOpsi');
      [...opsiBox.children].forEach((btn, i) => {
        btn.disabled = true;
        btn.classList.add('pointer-events-none');
        if (i === s.jBenar) {
          btn.className = 'w-full flex items-center gap-3 p-3.5 rounded-xl bg-primary text-on-primary font-body-md text-body-md text-left shadow-[0_3px_0_#004881]';
          btn.innerHTML = `<span class="material-symbols-outlined text-[20px]">check_circle</span><span class="flex-1">${s.opsi[i].t}</span>`;
        } else if (i === idx && !benar) {
          btn.className = 'w-full flex items-center gap-3 p-3.5 rounded-xl bg-error text-on-error font-body-md text-body-md text-left shadow-[0_3px_0_#93000a]';
          btn.innerHTML = `<span class="material-symbols-outlined text-[20px]">cancel</span><span class="flex-1">${s.opsi[i].t}</span>`;
        } else {
          btn.classList.add('opacity-50');
        }
      });

      // Tampilkan pembahasan
      const box = document.getElementById('pembahasanBox');
      const header = document.getElementById('pembahasanHeader');
      const teks = document.getElementById('pembahasanTeks');
      teks.textContent = s.b;
      if (benar) {
        header.innerHTML = '<span class="material-symbols-outlined text-primary text-[22px]">check_circle</span><span class="font-label-lg text-label-lg text-primary">Benar! +10 poin</span>';
        teks.className = 'font-body-sm text-body-sm text-on-surface-variant leading-relaxed';
      } else {
        header.innerHTML = '<span class="material-symbols-outlined text-error text-[22px]">cancel</span><span class="font-label-lg text-label-lg text-error">Belum tepat</span>';
        teks.className = 'font-body-sm text-body-sm text-on-surface-variant leading-relaxed';
      }
      box.classList.remove('hidden');
      document.getElementById('btnLanjut').classList.remove('hidden');
    }

    function lanjutSoal() {
      indexSoal++;
      if (indexSoal < soalAktif.length) {
        tampilkanSoal();
      } else {
        selesaiKuis();
      }
    }

    // ===== SELESAI & SIMPAN HASIL =====
    function selesaiKuis() {
      const total = soalAktif.length;
      const nilai = Math.round((jawabanBenar / total) * 100);

      document.getElementById('screenKuis').classList.add('hidden');
      document.getElementById('screenKuis').classList.remove('flex');
      document.getElementById('screenHasil').classList.remove('hidden');
      document.getElementById('screenHasil').classList.add('flex');

      document.getElementById('hasilNilai').textContent = nilai;
      document.getElementById('hasilRincian').textContent =
        'Jawaban benar: ' + jawabanBenar + ' dari ' + total + ' soal • Tingkat: ' + LEVEL_INFO[levelAktif].nama;

      // Sound effect kuis selesai
      playSoundFinish();

      simpanHasil(nilai);
      document.getElementById('bestScoreHeader').textContent = getBestScoreAny();
    }

    function simpanHasil(nilai) {
      // Profil siswa dari identitas.html
      let profil = { name: 'Siswa', school: 'PKBM Hasanah Marzuki' };
      try {
        const p = JSON.parse(localStorage.getItem('petualangan_siswa_profile') || 'null');
        if (p) profil = { name: p.name, school: p.school };
      } catch (e) { }

      // Riwayat percobaan
      let riwayat = [];
      try { riwayat = JSON.parse(localStorage.getItem('pkbm_quiz_history') || '[]'); } catch (e) { }
      riwayat.push({ name: profil.name, school: profil.school, level: levelAktif, score: nilai, date: new Date().toISOString() });
      localStorage.setItem('pkbm_quiz_history', JSON.stringify(riwayat));

      // Nilai terbaik per level
      const keyBest = 'pkbm_quiz_best_' + levelAktif;
      const best = parseInt(localStorage.getItem(keyBest) || '0', 10);
      if (nilai > best) localStorage.setItem(keyBest, String(nilai));

      // Papan peringkat: nilai terbaik per siswa (tanpa duplikat)
      let board = [];
      try { board = JSON.parse(localStorage.getItem('pkbm_leaderboard') || '[]'); } catch (e) { }
      const existing = board.find(x => x.name === profil.name);
      if (existing) {
        // Simpan nilai terbaik
        if (nilai > existing.score) existing.score = nilai;
      } else {
        board.push({ name: profil.name, school: profil.school, score: nilai });
      }
      localStorage.setItem('pkbm_leaderboard', JSON.stringify(board));
    }

    function getBestScore(level) {
      return parseInt(localStorage.getItem('pkbm_quiz_best_' + level) || '0', 10);
    }
    function getBestScoreAny() {
      return Math.max(getBestScore('mudah'), getBestScore('sedang'), getBestScore('sulit'));
    }

    function mulaiUlang() {
      document.getElementById('screenHasil').classList.add('hidden');
      document.getElementById('screenHasil').classList.remove('flex');
      document.getElementById('screenPilih').classList.remove('hidden');
      renderLevel();
      window.scrollTo(0, 0);
    }

    // ===== INIT =====
    document.getElementById('btnLanjut').addEventListener('click', lanjutSoal);
    document.getElementById('bestScoreHeader').textContent = getBestScoreAny();
    renderLevel();
  </script>
