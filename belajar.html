<!DOCTYPE html>

<html lang="id">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    name="viewport" />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    rel="stylesheet" />
  <style>
    @layer base {

      html,
      body {
        width: 100vw;
        margin: 0;
        padding: 0;
        background-color: #f4faff;
      }

      body {
        overscroll-behavior: none;
      }

      .pb-safe {
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }

      .pt-safe {
        padding-top: env(safe-area-inset-top, 0px);
      }
    }

    ::-webkit-scrollbar {
      display: none;
    }
  </style>
  <script src="https://cdn.tailwindcss.com"></script>
  <script
    id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "on-primary-fixed": "#001c38", "error-container": "#ffdad6", "secondary-fixed-dim": "#e8c41d", "outline": "#707783", "surface-container": "#e3f0f8", "surface-container-high": "#ddeaf2", "on-tertiary-fixed-variant": "#6d3a00", "on-error": "#ffffff", "on-secondary-fixed-variant": "#544600", "outline-variant": "#c0c7d4", "on-tertiary-container": "#fffbff", "surface-tint": "#0060a8", "on-primary-fixed-variant": "#004881", "on-primary-container": "#fdfcff", "surface-container-lowest": "#ffffff", "background": "#f4faff", "inverse-surface": "#263238", "on-secondary-fixed": "#221b00", "inverse-primary": "#a2c9ff", "tertiary-fixed": "#ffdcc2", "surface-variant": "#d7e4ec", "secondary-fixed": "#ffe16e", "primary-container": "#0077ce", "on-surface": "#111d23", "tertiary": "#8c4c00", "surface": "#f4faff", "primary-fixed": "#d3e4ff", "on-error-container": "#93000a", "tertiary-fixed-dim": "#ffb77b", "secondary": "#705d00", "error": "#ba1a1a", "surface-container-highest": "#d7e4ec", "surface-dim": "#cfdce4", "surface-bright": "#f4faff", "on-secondary-container": "#705e00", "inverse-on-surface": "#e6f3fb", "primary-fixed-dim": "#a2c9ff", "tertiary-container": "#b06000", "secondary-container": "#fdd835", "on-secondary": "#ffffff", "on-tertiary-fixed": "#2e1500", "on-surface-variant": "#404752", "on-background": "#111d23", "surface-container-low": "#e9f6fd", "primary": "#005ea4", "on-primary": "#ffffff", "on-tertiary": "#ffffff" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "margin-mobile": "1rem", "space-sm": "0.5rem", "space-xl": "2.5rem", "space-lg": "1.5rem", "margin": "2rem", "space-xs": "0.25rem", "space-md": "1rem" }, fontFamily: { "label-lg": ["Times New Roman"], "label-sm": ["Times New Roman"], "headline-lg": ["Times New Roman"], "title-md": ["Times New Roman"], "label-md": ["Times New Roman"], "headline-sm": ["Times New Roman"], "body-md": ["Times New Roman"], "body-sm": ["Times New Roman"], "headline-md": ["Times New Roman"] }, fontSize: { "label-lg": ["16px", { lineHeight: "20px", fontWeight: "700" }], "label-sm": ["12px", { lineHeight: "16px", fontWeight: "700" }], "headline-lg": ["32px", { lineHeight: "40px", fontWeight: "700" }], "title-md": ["18px", { lineHeight: "24px", fontWeight: "700" }], "label-md": ["14px", { lineHeight: "18px", fontWeight: "700" }], "headline-sm": ["20px", { lineHeight: "28px", fontWeight: "700" }], "body-md": ["16px", { lineHeight: "24px", fontWeight: "400" }], "body-sm": ["14px", { lineHeight: "20px", fontWeight: "400" }], "headline-md": ["24px", { lineHeight: "32px", fontWeight: "700" }] } } } };</script>
  <style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>

<body class="bg-surface font-body-md text-body-md text-on-surface flex flex-col min-h-screen">
  <header class="fixed top-0 w-full z-50 bg-surface/85 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.04)]">
    <div class="h-20 px-margin-mobile flex items-center justify-between gap-space-sm">
      <div class="flex items-center gap-space-sm min-w-0"><button aria-label="Kembali ke Menu"
          class="w-11 h-11 flex items-center justify-center rounded-xl bg-surface-container-high text-on-surface shadow-[0_3px_0_#c0c7d4] active:translate-y-[2px] active:shadow-[0_1px_0_#c0c7d4] transition-transform flex-shrink-0"
          onclick="window.location.href='dashboard.html'"><span
            class="material-symbols-outlined text-[20px]">arrow_back</span></button>
        <div class="flex flex-col min-w-0"><span class="font-label-sm text-label-sm text-primary truncate">Modul
            Belajar</span>
          <h1 class="font-title-md text-title-md text-on-surface truncate">Bahasa Indonesia Paket B</h1>
        </div>
      </div>
      <div class="flex items-center gap-space-xs">
        <div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center flex-shrink-0"><span
            class="material-symbols-outlined text-on-primary text-[18px]">menu_book</span></div>
      </div>
    </div>
  </header>
  <main class="flex flex-col relative w-full pt-24 pb-8 bg-surface min-h-screen px-margin-mobile">
    <div class="flex flex-col gap-space-md w-full max-w-lg mx-auto" id="materiList">
      <!-- Diisi oleh JavaScript -->
    </div>
    <!-- Halaman Baca Materi -->
    <div class="hidden flex-col gap-4 w-full max-w-lg mx-auto" id="materiView">
      <div class="flex items-center gap-2">
        <button
          class="inline-flex items-center gap-1.5 px-3 py-2 bg-surface-container rounded-xl text-primary font-label-md text-label-md shadow-sm active:scale-95 transition-all"
          onclick="tutupMateri()"><span class="material-symbols-outlined text-[18px]">arrow_back</span><span>Daftar
            Materi</span></button>
      </div>
      <article class="bg-surface-container-lowest rounded-xl shadow-md p-5 flex flex-col gap-3">
        <h2 class="font-headline-md text-headline-md text-primary" id="materiJudul"></h2>
        <p class="font-body-sm text-body-sm text-outline" id="materiSub"></p>
        <div class="flex flex-col gap-3 pt-1" id="materiIsi"></div>
      </article>
    </div>
  </main>
  <script>
    // ===== DATA MATERI BAHASA INDONESIA PAKET B =====
    const MATERI = [
      {
        id: 'teks-laporan',
        judul: 'Teks Laporan Observasi',
        sub: 'Materi 1 • Melaporkan hasil pengamatan',
        ikon: 'assignment',
        warna: 'text-primary',
        isi: [
          { t: 'h', v: 'Pengertian' },
          { t: 'p', v: 'Teks laporan observasi adalah teks yang berisi hasil pengamatan secara cermat dan objektif terhadap suatu objek, misalnya tumbuhan, hewan, atau kejadian.' },
          { t: 'h', v: 'Ciri-ciri Teks Laporan Observasi' },
          { t: 'list', v: ['Berisi fakta dan data yang nyata', 'Menggunakan bahasa baku dan objektif', 'Tidak memihak (tidak beropini)', 'Dilengkapi klasifikasi dan deskripsi objek'] },
          { t: 'h', v: 'Struktur' },
          { t: 'list', v: ['Pernyataan umum: memperkenalkan objek yang diamati', 'Deskripsi bagian: menjelaskan bagian-bagian objek', 'Deskripsi manfaat: menjelaskan guna/manfaat objek'] },
          { t: 'h', v: 'Contoh' },
          { t: 'p', v: 'Kucing adalah hewan menyusui yang termasuk keluarga Felidae. Kucing memiliki cakar tajam, indra pendengaran yang kuat, dan biasa dipelihara manusia untuk menjaga rumah dari hewan pengerat.' }
        ]
      },
      {
        id: 'puisi',
        judul: 'Puisi dan Unsur-Unsurnya',
        sub: 'Materi 2 • Memahami ungkapan perasaan dalam puisi',
        ikon: 'favorite',
        warna: 'text-tertiary',
        isi: [
          { t: 'h', v: 'Pengertian' },
          { t: 'p', v: 'Puisi adalah karya sastra yang mengungkapkan perasaan dan pikiran penyair secara imajinatif dengan bahasa yang dipadatkan.' },
          { t: 'h', v: 'Unsur Batin Puisi' },
          { t: 'list', v: ['Tema: pokok pikiran yang menjadi dasar puisi', 'Suasana/nuansa: perasaan yang menyelimuti puisi', 'Amanat: pesan yang ingin disampaikan penyair', 'Rima: pengulangan bunyi yang teratur'] },
          { t: 'h', v: 'Unsur Fisik Puisi' },
          { t: 'list', v: ['Diksi: pemilihan kata', 'Imaji/ima: gambaran benda melalui pancaindra', 'Tipografi: bentuk penulisan puisi', 'Bunyi: persamaan bunyi seperti sajak'] },
          { t: 'h', v: 'Contoh Bait Pantun' },
          { t: 'p', v: 'Jalan berkelok ke puncak gunung,<br>Pohon beringin rindang sekali.<br>Belajar rajin jangan sudah lupa olahraga,<br>Agar tubuh sehat dan pikiran ceria.' }
        ]
      },
      {
        id: 'cerpen',
        judul: 'Cerpen (Cerita Pendek)',
        sub: 'Materi 3 • Menikmati dan menganalisis cerita',
        ikon: 'auto_stories',
        warna: 'text-primary',
        isi: [
          { t: 'h', v: 'Pengertian' },
          { t: 'p', v: 'Cerpen adalah cerita rekaan (fiksi) yang pendek, hanya memuat satu peristiwa penting, sedikit tokoh, dan latar yang terbatas.' },
          { t: 'h', v: 'Unsur Intrinsik Cerpen' },
          { t: 'list', v: ['Tema: dasar cerita yang menjiwai keseluruhan', 'Tokoh dan penokohan: pelaku dalam cerita', 'Alur/plot: urutan peristiwa (awal-konflik-klimat-penyelesaian)', 'Latar/setting: tempat dan waktu kejadian', 'Sudut pandang: posisi pengisah cerita', 'Amanat: pesan moral cerita'] },
          { t: 'h', v: 'Ciri Cerpen' },
          { t: 'list', v: ['Pendek (biasanya kurang dari 10.000 kata)', 'Hanya memuat satu kesatuan efek', 'Dapat dibaca sekali duduk (± 30-60 menit)'] }
        ]
      },
      {
        id: 'surat-resmi',
        judul: 'Surat Resmi dan Surat Dinas',
        sub: 'Materi 4 • Menulis surat dengan bahasa baku',
        ikon: 'mail',
        warna: 'text-tertiary',
        isi: [
          { t: 'h', v: 'Pengertian' },
          { t: 'p', v: 'Surat resmi adalah surat yang ditulis berdasarkan aturan tata bahasa yang baku dan umum digunakan untuk kepentingan resmi, misalnya surat izin dan surat undangan.' },
          { t: 'h', v: 'Bagian-Bagian Surat Resmi' },
          { t: 'list', v: ['Kop surat: nama dan alamat lembaga', 'Nomor, lampiran, dan hal', 'Tanggal surat', 'Alamat tujuan surat', 'Salam pembuka', 'Isi surat: pembukaan, inti, penutup', 'Salam penutup dan tanda tangan'] },
          { t: 'h', v: 'Kaidah Kebahasaan' },
          { t: 'list', v: ['Menggunakan bahasa baku dan formal', 'Menggunakan kata ganti diri ketiga', 'Kalimat efektif dan lugas', 'Tidak memakai singkatan tidak baku'] }
        ]
      },
      {
        id: 'iklan-slogan',
        judul: 'Teks Iklan, Slogan, dan Poster',
        sub: 'Materi 5 • Bahasa yang persuasif',
        ikon: 'campaign',
        warna: 'text-primary',
        isi: [
          { t: 'h', v: 'Teks Iklan' },
          { t: 'p', v: 'Iklan adalah pengumuman yang bertujuan mendorong atau mengajak khalayak untuk membeli atau memanfaatkan barang/jasa yang ditawarkan.' },
          { t: 'h', v: 'Ciri Teks Iklan' },
          { t: 'list', v: ['Berbahasa persuasif (mengajak)', 'Singkat, jelas, dan menarik perhatian', 'Menggunakan kata bermajasah (kadang berlebihan)', 'Dilengkapi gambar dan kata kunci'] },
          { t: 'h', v: 'Slogan dan Poster' },
          { t: 'p', v: 'Slogan adalah kalimat pendek yang mudah diingat untuk menyampaikan ajakan. Poster adalah media grafis yang menggabungkan gambar dan teks untuk menyampaikan informasi atau ajakan.' }
        ]
      },
      {
        id: 'drama',
        judul: 'Drama dan Naskah Drama',
        sub: 'Materi 6 • Menanggapi dan mementaskan drama',
        ikon: 'theater_comedy',
        warna: 'text-tertiary',
        isi: [
          { t: 'h', v: 'Pengertian' },
          { t: 'p', v: 'Drama adalah karya sastra yang ditulis dalam bentuk dialog dan dimaksudkan untuk dipentaskan.' },
          { t: 'h', v: 'Unsur Naskah Drama' },
          { t: 'list', v: ['Protagonis: tokoh baik dalam drama', 'Antagonis: tokoh jahat/lawan protagonis', 'Dialog: percakapan antartokoh', 'Kramagung/lakuan: penjelasan tentang latar dan gerak tokoh', 'Prolog: pembukaan cerita', 'Epilog: penutup cerita'] },
          { t: 'h', v: 'Teknik Penokohan' },
          { t: 'list', v: ['Teknik analitik: penokohan lewat deskripsi dalam kramagung', 'Teknik dramatik: penokohan lewat dialog, perbuatan, dan komentar tokoh lain'] }
        ]
      }
    ];

    // ===== RENDER DAFTAR MATERI =====
    function renderDaftar() {
      const list = document.getElementById('materiList');
      let html = '';
      MATERI.forEach((m, i) => {
        html += `
      <button class="flex flex-col items-start bg-surface-container-lowest rounded-xl p-space-md shadow-md text-left gap-1.5 active:translate-y-0.5 transition-transform" onclick="bukaMateri(${i})">
        <div class="flex items-center gap-3 w-full">
          <div class="w-11 h-11 rounded-xl bg-surface-container flex items-center justify-center flex-shrink-0">
            <span class="material-symbols-outlined text-[24px] ${m.warna}">${m.ikon}</span>
          </div>
          <div class="flex flex-col min-w-0 flex-1">
            <span class="font-label-sm text-label-sm text-outline">${m.sub}</span>
            <span class="font-title-md text-title-md text-on-surface truncate">${m.judul}</span>
          </div>
          <span class="material-symbols-outlined text-outline text-[22px]">chevron_right</span>
        </div>
      </button>`;
      });
      list.innerHTML = html;
    }

    // ===== BACA MATERI =====
    function bukaMateri(index) {
      const m = MATERI[index];
      document.getElementById('materiJudul').textContent = m.judul;
      document.getElementById('materiSub').textContent = m.sub;
      let isi = '';
      m.isi.forEach(blok => {
        if (blok.t === 'h') {
          isi += `<h3 class="font-title-md text-title-md text-on-surface pt-1">${blok.v}</h3>`;
        } else if (blok.t === 'p') {
          isi += `<p class="font-body-md text-body-md text-on-surface-variant leading-relaxed">${blok.v}</p>`;
        } else if (blok.t === 'list') {
          isi += '<ul class="flex flex-col gap-1.5 pl-1">' + blok.v.map(item => `
          <li class="flex items-start gap-2 font-body-md text-body-md text-on-surface-variant">
            <span class="material-symbols-outlined text-primary text-[18px] mt-0.5">check_circle</span>
            <span>${item}</span>
          </li>`).join('') + '</ul>';
        }
      });
      document.getElementById('materiIsi').innerHTML = isi;

      document.getElementById('materiList').classList.add('hidden');
      document.getElementById('materiView').classList.remove('hidden');
      document.getElementById('materiView').classList.add('flex');
      window.scrollTo(0, 0);
    }

    function tutupMateri() {
      document.getElementById('materiView').classList.add('hidden');
      document.getElementById('materiView').classList.remove('flex');
      document.getElementById('materiList').classList.remove('hidden');
      window.scrollTo(0, 0);
    }

    renderDaftar();
  </script>
</body>

</html>
