<body class="bg-surface font-body-md text-body-md text-on-surface flex flex-col min-h-screen pt-safe pb-safe">
<main class="flex flex-col relative w-full min-h-screen bg-surface px-margin-mobile">
<div class="flex flex-col w-full relative select-none" id="splash-screen-root">
<div class="relative w-full overflow-hidden rounded-xl shadow-xl flex flex-col justify-end items-center cursor-pointer active:scale-[0.99] transition-transform duration-200">
<!-- Visual Cover Artwork (IMAGE_2) -->
<img alt="Petualangan Belajar Bahasa Indonesia Cover Art" class="w-full h-auto max-h-[85vh] object-contain mx-auto block pointer-events-none rounded-xl" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCMNu7R_IZKNxstp64bxdBEWNDUfEEfOZV9h0QWwBR_btUsXyPRwTHL6Ve1fLlOmcUN2X91bBeLTvi4b03BSMrDnjCv3sI05jieGl-FEOvSxfRVslhijLMkFiaQWtQIkcfcM_FpCACB_e9PsmMpRM5q9Y2d7b7hkMFUgDC18kmNQJLJGf2XYLbLT5TJ5fthLs2ZclCNBeU3uyjBvf80CuYTqkbkN9Pjm7NXoittYFk"/>
<!-- Ambient Gradient Softener at Bottom -->
<div class="absolute inset-x-0 bottom-0 h-36 bg-gradient-to-t from-primary/80 via-primary/30 to-transparent pointer-events-none rounded-b-xl flex flex-col justify-end items-center pb-6">
<!-- Tap Prompt with Tactile Pulsing Glow -->
<div class="px-5 py-2 rounded-full bg-surface-container-lowest/90 backdrop-blur-md shadow-md animate-pulse flex items-center gap-2">
<span class="material-symbols-outlined text-secondary-container text-[18px]" style="font-variation-settings: 'FILL' 1;">
          touch_app
        </span>
<p class="font-label-md text-label-md text-on-surface tracking-wide">
          Sentuh di mana saja untuk mulai
        </p>
</div>
</div>
<!-- Interactive Tap Trigger Layer covering the whole card -->
<button aria-label="Mulai Petualangan Belajar Bahasa Indonesia" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer focus:outline-none" id="splash-click-target" type="button">
</button>
</div>
<!-- Decorative Cultural Little Motif -->
<div class="flex items-center justify-center gap-2 mt-4 opacity-75">
<span class="material-symbols-outlined text-primary text-[16px]">menu_book</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Modul Pembelajaran Literasi Paket B</span>
<span class="material-symbols-outlined text-secondary-fixed-dim text-[16px]">stars</span>
</div>
<script>
    (function() {
      const splashCard = document.getElementById('splash-screen-root');
      if (splashCard) {
        splashCard.addEventListener('click', function(e) {
          // Micro-interaction: tactile bounce & gentle exit transition
          splashCard.style.transition = 'transform 0.25s ease-out, opacity 0.25s ease-out';
          splashCard.style.transform = 'scale(0.97)';
          splashCard.style.opacity = '0.7';

          // Emit customary routing or state transition
          setTimeout(function() {
            window.location.href = 'identitas.html';
          }, 260);
        });
      }
    })();
  </script>
</div>
</main>
